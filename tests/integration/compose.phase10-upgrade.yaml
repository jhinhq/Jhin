    environment:
      <<: *phase9-environment
      TEMPORAL_NAMESPACE: ${PHASE10_UPGRADE_NAMESPACE_CLEANUP:?required}
      JHIN_TEST_CRASH_BARRIER_DIR: /run/jhin/test-barriers
      JHIN_TEST_CRASH_BARRIER_NAME: ${PHASE10_UPGRADE_BARRIER_CLEANUP_NAME:-}
      JHIN_TEST_CRASH_BARRIER_MATCH: ${PHASE10_UPGRADE_BARRIER_CLEANUP_MATCH:-}
    volumes:
      - ${PHASE10_UPGRADE_BARRIER_CLEANUP_HOST:?required}:/run/jhin/test-barriers

  phase10-agent-worker-normal:
    <<: *phase10-agent
    environment:
      <<: *phase10-agent-environment
      TEMPORAL_NAMESPACE: ${PHASE10_UPGRADE_NAMESPACE_NORMAL:?required}
    volumes:
      - ${PHASE10_UPGRADE_BARRIER_NORMAL_HOST:?required}:/run/jhin/test-barriers

  phase10-agent-worker-approval:
    <<: *phase10-agent
    environment:
      <<: *phase10-agent-environment
      TEMPORAL_NAMESPACE: ${PHASE10_UPGRADE_NAMESPACE_APPROVAL:?required}
    volumes:
      - ${PHASE10_UPGRADE_BARRIER_APPROVAL_HOST:?required}:/run/jhin/test-barriers

  phase10-agent-worker-sync:
    <<: *phase10-agent
    environment:
      <<: *phase10-agent-environment
      TEMPORAL_NAMESPACE: ${PHASE10_UPGRADE_NAMESPACE_SYNC:?required}
    volumes:
      - ${PHASE10_UPGRADE_BARRIER_SYNC_HOST:?required}:/run/jhin/test-barriers

  phase10-agent-worker-cleanup:
    <<: *phase10-agent
    environment:
      <<: *phase10-agent-environment
      TEMPORAL_NAMESPACE: ${PHASE10_UPGRADE_NAMESPACE_CLEANUP:?required}
    volumes:
      - ${PHASE10_UPGRADE_BARRIER_CLEANUP_HOST:?required}:/run/jhin/test-barriers

  phase10-tool-worker-normal:
    <<: *phase10-tool
    environment:
