name: jhin

# Production-shaped stack (plan section 24). Only web and api publish ports;
# infrastructure services stay on internal networks. Dev conveniences
# (localhost-bound infra ports, hot reload) live in compose.dev.yaml.

x-python-build: &python-build
  context: .
  dockerfile: docker/python.Dockerfile

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Jhin}
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [edge]
    restart: unless-stopped

  api:
    build:
      <<: *python-build
      args:
        SERVICE_PACKAGE: jhin-api
    command: ["uvicorn", "jhin_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_NAME: ${APP_NAME:-Jhin}
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jhin}:${POSTGRES_PASSWORD:-jhin}@postgres:5432/${POSTGRES_DB:-jhin}
      NATS_URL: nats://nats:4222
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      MASTER_KEY_FILE: /run/secrets/jhin_master_key
    secrets:
      - jhin_master_key
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [edge, control, data]
    restart: unless-stopped

  workflow-worker:
    build:
      <<: *python-build
      args:
        SERVICE_PACKAGE: jhin-workflow-worker
    command: ["jhin-workflow-worker"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "jhin-health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [control]
    restart: unless-stopped

  agent-worker:
    build:
      <<: *python-build
      args:
        SERVICE_PACKAGE: jhin-agent-worker
    command: ["jhin-agent-worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jhin}:${POSTGRES_PASSWORD:-jhin}@postgres:5432/${POSTGRES_DB:-jhin}
      NATS_URL: nats://nats:4222
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      MASTER_KEY_FILE: /run/secrets/jhin_master_key
    secrets:
      - jhin_master_key
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "jhin-temporal-poller-check", "jhin-agent-queue"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [control, data]
    restart: unless-stopped

  tool-worker:
    build:
      <<: *python-build
      args:
        SERVICE_PACKAGE: jhin-tool-worker
    command: ["jhin-tool-worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jhin}:${POSTGRES_PASSWORD:-jhin}@postgres:5432/${POSTGRES_DB:-jhin}
      NATS_URL: nats://nats:4222
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      MASTER_KEY_FILE: /run/secrets/jhin_master_key
      SANDBOX_RUNNER_URL: http://sandbox-runner:8085
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-dev-sandbox-runner-token}
      SANDBOX_DEFAULT_IMAGE: ${SANDBOX_DEFAULT_IMAGE:-jhin-sandbox:latest}
    secrets:
      - jhin_master_key
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "jhin-temporal-poller-check", "jhin-tool-queue"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [control, data, runner]
    restart: unless-stopped

  # The only service allowed to create sandbox jobs. Docker authority is
  # deliberately absent from this base file: exactly one rootful/rootless
  # overlay must supply it. The runner itself always remains UID/GID 10001.
  sandbox-runner:
    build:
      <<: *python-build
      args:
        SERVICE_PACKAGE: jhin-sandbox-runner
    image: ${SANDBOX_RUNNER_IMAGE:-jhin-sandbox-runner:local}
    pull_policy: build
    command: ["jhin-sandbox-runner"]
    user: "10001:10001"
    privileged: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-dev-sandbox-runner-token}
      SANDBOX_DEFAULT_IMAGE: ${SANDBOX_DEFAULT_IMAGE:-jhin-sandbox:latest}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-jhin_sandbox}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8085/health", timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [runner]
    restart: unless-stopped

  # Build-only pseudo-service for the default sandbox job image. Activate
  # with the "build" profile: `docker compose --profile build build
  # sandbox-image` (make dev does this automatically). It never runs as part
  # of the stack.
  sandbox-image:
    profiles: ["build"]
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    image: ${SANDBOX_DEFAULT_IMAGE:-jhin-sandbox:latest}
    command: ["true"]
    restart: "no"

  event-worker:
    build:
      <<: *python-build
      args:
        SERVICE_PACKAGE: jhin-event-worker
    command: ["jhin-event-worker"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NATS_URL: nats://nats:4222
      # Trigger matching: reads triggers, records invocations, starts
      # TriggeredTaskWorkflow (plan 10.5).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jhin}:${POSTGRES_PASSWORD:-jhin}@postgres:5432/${POSTGRES_DB:-jhin}
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "jhin-health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # control for NATS/Temporal, data for Postgres (trigger matching).
    networks: [control, data]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jhin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jhin}
      POSTGRES_DB: ${POSTGRES_DB:-jhin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jhin} -d ${POSTGRES_DB:-jhin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]
    restart: unless-stopped

  nats:
    image: nats:2.12-alpine
    command: ["--config", "/etc/nats/nats.conf"]
    volumes:
      - nats_data:/data
      - ./config/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [control]
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-jhin}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-jhin}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health | grep -q SERVING"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [control, data]
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.53.3
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:8080/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [control]
    restart: unless-stopped

networks:
  edge:
    driver: bridge
    external: false
  control:
    driver: bridge
    external: false
  data:
    driver: bridge
    external: false
  # tool-worker ↔ sandbox-runner only (plan 24.1). Job containers are NOT
  # on this network: they get "none" or the jhin_sandbox bridge below.
  runner:
    driver: bridge
    external: false
  # Dedicated bridge for network_policy=internet jobs (plan 14.4). No
  # control-plane service may ever attach to it; in production nothing in
  # this file references it and the runner creates it via the Docker API.
  # The fixed name keeps the runner's SANDBOX_NETWORK default valid for any
  # compose project name.
  sandbox:
    name: ${SANDBOX_NETWORK:-jhin_sandbox}
    driver: bridge
    external: false

volumes:
  postgres_data:
  nats_data:

# The master key encrypts all user secrets (plan 13.2). It is mounted only
# into services that must decrypt (api, agent-worker, tool-worker) — never into web.
# Create the dev key with `make master-key`.
secrets:
  jhin_master_key:
    file: ${MASTER_KEY_FILE_HOST:-./secrets/dev/jhin_master_key}
