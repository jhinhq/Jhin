# Security gates: CodeQL (Python + JavaScript/TypeScript), dependency review
# on pull requests, Python dependency audit (pip-audit over the frozen uv
# export), pnpm audit (advisory only), secret detection (gitleaks), and a
# Trivy filesystem/configuration scan. Critical findings fail the workflow;
# high findings are reported as SARIF for review.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rescan so newly published advisories surface without a commit.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Runtime dependencies with copyleft-for-SaaS or source-available
          # licenses need a recorded distribution review (spec section 6.4).
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
          comment-summary-in-pr: on-failure

  python-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Export the frozen runtime dependency set
        run: |
          uv export --frozen --all-packages --no-dev --no-emit-workspace \
            --no-hashes --format requirements-txt \
            --output-file "$RUNNER_TEMP/requirements.txt"
          wc -l "$RUNNER_TEMP/requirements.txt"

      - name: pip-audit
        run: |
          uvx pip-audit \
            --requirement "$RUNNER_TEMP/requirements.txt" \
            --strict \
            --progress-spinner off

  pnpm-audit:
    name: pnpm audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: pnpm audit
        # Advisory only: transitive Next.js/toolchain advisories are reviewed
        # by maintainers and raised through Dependabot; the blocking gate for
        # the web package is dependency-review on pull requests.
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

  secrets:
    name: Secret detection (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks over tracked content and history
        # The config is read from the same read-only mount as the source; it
        # allowlists the synthetic credentials that published test commits
        # carry and that history cannot be edited to remove.
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --verbose --exit-code 1

      - name: Repository pattern scan (release preflight subset)
        run: python3 scripts/release_preflight.py --only secrets

  trivy-fs:
    name: Trivy filesystem and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Trivy (vulnerabilities, misconfigurations, secrets) - report
        # The action's tags carry a v prefix; a bare "0.28.0" no longer
        # resolves to anything.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Trivy - fail on critical findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"
