[project]
name = "jhin-api"
version = "0.1.0"
description = "Jhin FastAPI control plane"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "nats-py>=2.13",
    "temporalio>=1.31",
    "jhin-db",
    "jhin-events",
    "jhin-observability",
]

[tool.uv.sources]
jhin-db = { workspace = true }
jhin-events = { workspace = true }
jhin-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_api"]
