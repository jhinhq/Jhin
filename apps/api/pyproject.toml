[project]
name = "jhin-api"
version = "0.1.0"
description = "Jhin FastAPI control plane"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "nats-py>=2.13",
    "temporalio>=1.31",
    "argon2-cffi>=23.1",
    # Multipart avatar uploads and the image pipeline (via jhin-media).
    "python-multipart>=0.0.20",
    "pillow>=11.0",
    "opentelemetry-api>=1.38,<2",
    "starlette>=1.6,<2",
    # The catalog index: risk mapping and ingest-side text cleaning, reused
    # by the read side so the two halves cannot disagree.
    "jhin-catalog-sync",
    "jhin-connectors",
    "jhin-db",
    "jhin-domain",
    "jhin-events",
    "jhin-media",
    "jhin-memory",
    "jhin-models",
    "jhin-oauth",
    "jhin-observability",
    "jhin-policy",
    "jhin-secrets",
    "jhin-skills",
    "jhin-tools",
    "jhin-triggers",
    "jhin-workflows",
]

[project.scripts]
jhin-seed-dev = "jhin_api.seed:main"
jhin-admin = "jhin_api.cli:main"

[tool.uv.sources]
jhin-catalog-sync = { workspace = true }
jhin-connectors = { workspace = true }
jhin-db = { workspace = true }
jhin-domain = { workspace = true }
jhin-events = { workspace = true }
jhin-media = { workspace = true }
jhin-memory = { workspace = true }
jhin-models = { workspace = true }
jhin-oauth = { workspace = true }
jhin-observability = { workspace = true }
jhin-policy = { workspace = true }
jhin-secrets = { workspace = true }
jhin-skills = { workspace = true }
jhin-tools = { workspace = true }
jhin-triggers = { workspace = true }
jhin-workflows = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_api"]
