[project]
name = "jhin-api"
version = "0.1.0"
description = "Jhin FastAPI control plane"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "nats-py>=2.13",
    "temporalio>=1.31",
    "argon2-cffi>=23.1",
    "jhin-db",
    "jhin-domain",
    "jhin-events",
    "jhin-models",
    "jhin-observability",
    "jhin-secrets",
    "jhin-workflows",
]

[project.scripts]
jhin-seed-dev = "jhin_api.seed:main"

[tool.uv.sources]
jhin-db = { workspace = true }
jhin-domain = { workspace = true }
jhin-events = { workspace = true }
jhin-models = { workspace = true }
jhin-observability = { workspace = true }
jhin-secrets = { workspace = true }
jhin-workflows = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_api"]
