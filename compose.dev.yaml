# Development overrides: bind infrastructure ports to localhost so host
# tooling (uv run scripts, integration tests, psql, nats CLI, Temporal UI)
# can reach the stack. Usage: docker compose -f compose.yaml -f compose.dev.yaml up -d
services:
  api:
    environment:
      APP_ENV: dev

  # Dev/test-only fake OpenAI-compatible provider so agents can run without
  # real API keys (plan 32.2, 38). Reused agent-worker image; never part of
  # the production-shaped compose.yaml.
  fake-provider:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        SERVICE_PACKAGE: jhin-agent-worker
    command: ["python", "-m", "jhin_models.testing.fake_openai"]
    environment:
      FAKE_PROVIDER_PORT: "8080"
    ports:
      - "127.0.0.1:${FAKE_PROVIDER_DEV_PORT:-8090}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/models', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [data]
    restart: unless-stopped

  # Dev/test-only fake GitHub REST API so the GitHub connector exit tests run
  # with zero real credentials (plan 32.2). Connections point at it via
  # config_json.base_url (in-network: http://fake-github:8080).
  fake-github:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        SERVICE_PACKAGE: jhin-agent-worker
    command: ["python", "-m", "jhin_connectors.testing.fake_github"]
    environment:
      FAKE_GITHUB_PORT: "8080"
      FAKE_GITHUB_TOKEN: ${FAKE_GITHUB_TOKEN:-fake-github-pat}
      FAKE_GITHUB_REPOS: ${FAKE_GITHUB_REPOS:-octo/alpha,octo/beta}
    ports:
      - "127.0.0.1:${FAKE_GITHUB_DEV_PORT:-8091}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/_state', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [data]
    restart: unless-stopped

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-55432}:5432"

  nats:
    ports:
      - "127.0.0.1:${NATS_DEV_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_DEV_PORT:-8222}:8222"

  temporal:
    ports:
      - "127.0.0.1:${TEMPORAL_DEV_PORT:-7233}:7233"

  temporal-ui:
    ports:
      - "127.0.0.1:${TEMPORAL_UI_DEV_PORT:-8233}:8080"
