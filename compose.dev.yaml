# Development overrides: bind infrastructure ports to localhost so host
# tooling (uv run scripts, integration tests, psql, nats CLI, Temporal UI)
# can reach the stack. Usage: docker compose -f compose.yaml -f compose.dev.yaml up -d
services:
  api:
    environment:
      APP_ENV: dev
      JHIN_CONNECTOR_ALLOWED_HTTP_ORIGINS: http://fake-github:8080,http://fake-linear:8080

  agent-worker:
    environment:
      JHIN_CONNECTOR_ALLOWED_HTTP_ORIGINS: http://fake-github:8080,http://fake-linear:8080

  # Dev/test-only fake OpenAI-compatible provider so agents can run without
  # real API keys (plan 32.2, 38). Reused agent-worker image; never part of
  # the production-shaped compose.yaml.
  fake-provider:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        SERVICE_PACKAGE: jhin-agent-worker
    command: ["python", "-m", "jhin_models.testing.fake_openai"]
    environment:
      FAKE_PROVIDER_PORT: "8080"
    ports:
      - "127.0.0.1:${FAKE_PROVIDER_DEV_PORT:-8090}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/models', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [data]
    restart: unless-stopped

  # Dev/test-only fake GitHub REST API so the GitHub connector exit tests run
  # with zero real credentials (plan 32.2). Connections point at it via
  # config_json.base_url (in-network: http://fake-github:8080).
  #
  # Phase 6: it also serves git smart-HTTP (`git http-backend`) for the same
  # seeded repos under /git/<owner>/<repo>.git, and joins the jhin_sandbox
  # network so sandbox jobs with network_policy=internet can clone/push
  # against it (dev/test only — production sandbox networks carry nothing).
  fake-github:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        SERVICE_PACKAGE: jhin-agent-worker
        INSTALL_GIT: "1"
    command: ["python", "-m", "jhin_connectors.testing.fake_github"]
    environment:
      FAKE_GITHUB_PORT: "8080"
      FAKE_GITHUB_TOKEN: ${FAKE_GITHUB_TOKEN:-fake-github-pat}
      FAKE_GITHUB_REPOS: ${FAKE_GITHUB_REPOS:-octo/alpha,octo/beta}
      FAKE_GITHUB_GIT_ROOT: /tmp/git
    ports:
      - "127.0.0.1:${FAKE_GITHUB_DEV_PORT:-8091}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/_state', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [data, sandbox]
    restart: unless-stopped

  # Dev/test-only fake Linear GraphQL API + webhook emitter so the Phase 7
  # trigger slice runs with zero real credentials (plan 32.2). Connections
  # point at it via config_json.base_url (in-network: http://fake-linear:8080).
  # Its admin endpoints simulate a human moving issues in Linear and fire
  # properly-signed webhooks at the API (see jhin_connectors.testing.fake_linear).
  fake-linear:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        SERVICE_PACKAGE: jhin-agent-worker
    command: ["python", "-m", "jhin_connectors.testing.fake_linear"]
    environment:
      FAKE_LINEAR_PORT: "8080"
      FAKE_LINEAR_API_KEY: ${FAKE_LINEAR_API_KEY:-fake-linear-api-key}
    ports:
      - "127.0.0.1:${FAKE_LINEAR_DEV_PORT:-8092}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/_state', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [data]
    restart: unless-stopped

  # Dev-only localhost binding of the internal sandbox runner API so the
  # security integration tests and manual curl walkthroughs can reach it.
  # NEVER published in the production-shaped compose.yaml.
  sandbox-runner:
    ports:
      - "127.0.0.1:${SANDBOX_RUNNER_DEV_PORT:-8093}:8085"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-55432}:5432"

  nats:
    ports:
      - "127.0.0.1:${NATS_DEV_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_DEV_PORT:-8222}:8222"

  temporal:
    ports:
      - "127.0.0.1:${TEMPORAL_DEV_PORT:-7233}:7233"

  temporal-ui:
    ports:
      - "127.0.0.1:${TEMPORAL_UI_DEV_PORT:-8233}:8080"
