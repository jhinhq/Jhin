[project]
name = "jhin-workspace"
version = "0.1.0"
description = "Jhin — self-hosted platform for hierarchical teams of autonomous AI agents (workspace root)"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "services/workflow_worker",
    "services/event_worker",
    "services/agent_worker",
    "packages/db",
    "packages/domain",
    "packages/events",
    "packages/workflows",
    "packages/observability",
    "packages/secrets",
    "packages/models",
    "packages/agents",
    "packages/policy",
    "packages/tools",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    # In-memory async SQLite for gateway/persistence unit tests.
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [
    "apps/api/src",
    "services/workflow_worker/src",
    "services/event_worker/src",
    "services/agent_worker/src",
    "packages/db/src",
    "packages/domain/src",
    "packages/events/src",
    "packages/workflows/src",
    "packages/observability/src",
    "packages/secrets/src",
    "packages/models/src",
    "packages/agents/src",
    "packages/policy/src",
    "packages/tools/src",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = [
    "apps/api/src",
    "services/workflow_worker/src",
    "services/event_worker/src",
    "services/agent_worker/src",
    "packages/db/src",
    "packages/domain/src",
    "packages/events/src",
    "packages/workflows/src",
    "packages/observability/src",
    "packages/secrets/src",
    "packages/models/src",
    "packages/agents/src",
    "packages/policy/src",
    "packages/tools/src",
    "scripts",
    "tests",
]

[[tool.mypy.overrides]]
module = ["nats.*", "uuid_utils.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "apps/api/tests",
    "packages/domain/tests",
    "packages/events/tests",
    "packages/workflows/tests",
    "packages/db/tests",
    "packages/secrets/tests",
    "packages/models/tests",
    "packages/agents/tests",
    "packages/policy/tests",
    "packages/tools/tests",
    "tests",
]
markers = [
    "integration: requires the running Docker Compose stack (deselected by default)",
]
addopts = "-m 'not integration'"
