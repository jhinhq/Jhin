[project]
name = "jhin-workspace"
version = "0.1.0"
description = "Jhin — self-hosted platform for hierarchical teams of autonomous AI agents (workspace root)"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "services/workflow_worker",
    "services/event_worker",
    "services/agent_worker",
    "services/tool_worker",
    "services/sandbox_runner",
    "packages/catalog",
    "packages/db",
    "packages/domain",
    "packages/events",
    "packages/workflows",
    "packages/oauth",
    "packages/observability",
    "packages/secrets",
    "packages/models",
    "packages/agents",
    "packages/policy",
    "packages/tools",
    "packages/connectors",
    "packages/triggers",
    "packages/media",
    "packages/memory",
    "packages/skills",
    "packages/personas",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    # In-memory async SQLite for gateway/persistence unit tests.
    "aiosqlite>=0.20",
    "tzdata>=2026.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs/superpowers/plans"]
src = [
    "apps/api/src",
    "services/workflow_worker/src",
    "services/event_worker/src",
    "services/agent_worker/src",
    "services/tool_worker/src",
    "services/sandbox_runner/src",
    "packages/catalog/src",
    "packages/db/src",
    "packages/domain/src",
    "packages/events/src",
    "packages/workflows/src",
    "packages/oauth/src",
    "packages/observability/src",
    "packages/secrets/src",
    "packages/models/src",
    "packages/agents/src",
    "packages/policy/src",
    "packages/tools/src",
    "packages/connectors/src",
    "packages/triggers/src",
    "packages/media/src",
    "packages/memory/src",
    "packages/skills/src",
    "packages/personas/src",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = [
    "apps/api/src",
    "services/workflow_worker/src",
    "services/event_worker/src",
    "services/agent_worker/src",
    "services/tool_worker/src",
    "services/sandbox_runner/src",
    "packages/catalog/src",
    "packages/db/src",
    "packages/domain/src",
    "packages/events/src",
    "packages/workflows/src",
    "packages/oauth/src",
    "packages/observability/src",
    "packages/secrets/src",
    "packages/models/src",
    "packages/agents/src",
    "packages/policy/src",
    "packages/tools/src",
    "packages/connectors/src",
    "packages/triggers/src",
    "packages/media/src",
    "packages/memory/src",
    "packages/skills/src",
    "packages/personas/src",
    "scripts",
    "tests",
]

[[tool.mypy.overrides]]
module = [
    "nats.*",
    "uuid_utils.*",
    "asyncpg.*",
    "aiodocker.*",
    "grpc",
    "grpc.*",
    "jhin_secrets.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["test_logging"]
disable_error_code = ["index"]

[[tool.mypy.overrides]]
module = ["test_log_audit"]
disable_error_code = ["redundant-cast"]

# aiodocker's volume API is untyped; calls into it are contained here.
[[tool.mypy.overrides]]
module = ["jhin_sandbox_runner.jobs"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "services/agent_worker/tests"]
# Two package test suites (packages/catalog/tests, packages/oauth/tests) carry
# an __init__.py, which without this makes pytest name both of them the
# top-level package `tests` -- colliding with each other and shadowing the
# repo-root `tests/` package. Resolving through namespace parents names them
# `packages.catalog.tests` and `packages.oauth.tests` instead, so each test
# module's import name is its path and no two can collide.
consider_namespace_packages = true
testpaths = [
    "apps/api/tests",
    "packages/catalog/tests",
    "packages/domain/tests",
    "packages/events/tests",
    "packages/workflows/tests",
    "packages/db/tests",
    "packages/oauth/tests",
    "packages/observability/tests",
    "packages/secrets/tests",
    "packages/models/tests",
    "packages/agents/tests",
    "packages/policy/tests",
    "packages/tools/tests",
    "packages/connectors/tests",
    "packages/triggers/tests",
    "packages/memory/tests",
    "packages/skills/tests",
    "packages/personas/tests",
    "packages/media/tests",
    "services/agent_worker/tests",
    "services/tool_worker/tests",
    "services/event_worker/tests",
    "services/workflow_worker/tests",
    "services/sandbox_runner/tests",
    "tests",
]
markers = [
    "integration: requires the running Docker Compose stack (deselected by default)",
]
addopts = "-m 'not integration' --import-mode=importlib"
