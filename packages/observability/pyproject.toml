[project]
name = "jhin-observability"
version = "0.1.0"
description = "Structured JSON logging and health heartbeat helpers for Jhin services"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.63.2,<2",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.38,<2",
    "opentelemetry-sdk>=1.38,<2",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36,<3",
    "structlog>=25.1",
    "temporalio==1.32.0",
]

[project.scripts]
jhin-health-check = "jhin_observability.healthfile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_observability"]
