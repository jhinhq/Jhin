[project]
name = "jhin-db"
version = "0.1.0"
description = "SQLAlchemy 2 async engine and Alembic migrations for Jhin"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "jhin-domain",
]

[tool.uv.sources]
jhin-domain = { workspace = true }

[project.scripts]
jhin-db-migrate = "jhin_db.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_db"]
