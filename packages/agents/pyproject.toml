[project]
name = "jhin-agents"
version = "0.1.0"
description = "Agent runtime: execution snapshots, prompt composition, and the run graph (plan section 7)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "jhin-db",
    "jhin-models",
    "jhin-personas",
    # render_safe_agent_name: the name in layer 1 of the prompt is held to
    # the same identity rules the tool that writes it applies.
    "jhin-policy",
]

[tool.uv.sources]
jhin-db = { workspace = true }
jhin-models = { workspace = true }
jhin-personas = { workspace = true }
jhin-policy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_agents"]
