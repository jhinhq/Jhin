[project]
name = "jhin-models"
version = "0.1.0"
description = "Model provider abstraction and adapters for Jhin (plan section 15)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "opentelemetry-api>=1.38,<2",
    "pydantic>=2.10",
    "jhin-domain",
    "jhin-observability",
]

[tool.uv.sources]
jhin-domain = { workspace = true }
jhin-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_models"]
