[project]
name = "jhin-domain"
version = "0.1.0"
description = "Dependency-light shared domain vocabulary for Jhin: enums and id helpers"
requires-python = ">=3.13"
dependencies = [
    "uuid-utils>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_domain"]
