[project]
name = "jhin-memory"
version = "0.1.0"
description = "Curated long-term memory: deterministic policy, hybrid retrieval, and structured candidate extraction (experience design, Memory)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "jhin-db",
    "jhin-domain",
    "jhin-models",
    "jhin-observability",
    "jhin-secrets",
]

[tool.uv.sources]
jhin-db = { workspace = true }
jhin-domain = { workspace = true }
jhin-models = { workspace = true }
jhin-observability = { workspace = true }
jhin-secrets = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_memory"]
