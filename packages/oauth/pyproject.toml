[project]
name = "jhin-oauth"
version = "0.1.0"
description = "OAuth 2.1 client core: discovery, dynamic client registration, PKCE, token exchange/refresh/revocation (docs/architecture/oauth.md)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.36",
    "jhin-db",
    "jhin-domain",
    "jhin-observability",
    "jhin-secrets",
]

[tool.uv.sources]
jhin-db = { workspace = true }
jhin-domain = { workspace = true }
jhin-observability = { workspace = true }
jhin-secrets = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_oauth"]
