[project]
name = "jhin-policy"
version = "0.1.0"
description = "Capability registry, risk levels, and the pure policy evaluator (plan section 12, 42)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_policy"]
