[project]
name = "jhin-policy"
version = "0.1.0"
description = "Capability registry, risk levels, and the pure policy evaluator (plan section 12, 42)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    # The content rules a persona card clears. An agent name is composed
    # into the system prompt *above* the persona block, so it clears the
    # same bar; jhin-personas is a pure, pydantic-only leaf like this one.
    "jhin-personas",
]

[tool.uv.sources]
jhin-personas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_policy"]
