[project]
name = "jhin-secrets"
version = "0.1.0"
description = "Envelope-encrypted secret storage and log redaction for Jhin"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "jhin-db",
    "jhin-domain",
    "jhin-observability",
]

[tool.uv.sources]
jhin-db = { workspace = true }
jhin-domain = { workspace = true }
jhin-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_secrets"]
