[project]
name = "jhin-catalog-sync"
version = "0.1.0"
description = "The app and skill catalog index: fetch, verify, and load one published generation (docs/architecture/catalog.md)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "jhin-db",
    "jhin-domain",
    "jhin-policy",
    "jhin-secrets",
    "jhin-tools",
]

[project.scripts]
jhin-catalog-sync = "jhin_catalog_sync.cli:main"

[tool.uv.sources]
jhin-db = { workspace = true }
jhin-domain = { workspace = true }
jhin-policy = { workspace = true }
jhin-secrets = { workspace = true }
jhin-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_catalog_sync"]
