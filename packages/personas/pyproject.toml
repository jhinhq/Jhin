[project]
name = "jhin-personas"
version = "0.1.0"
description = "Personas: how an agent acts and sounds, as a structured card of named facets — the TOML format, the validation rules, and the curated cast Jhin ships"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_personas"]
