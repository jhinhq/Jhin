[project]
name = "jhin-tool-worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "websockets>=15",
  "jhin-media",
  "temporalio>=1.31",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "nats-py>=2.13",
  "jhin-connectors",
  "jhin-db",
  "jhin-domain",
  "jhin-events",
  "jhin-oauth",
  "jhin-observability",
  "jhin-secrets",
  "jhin-tools",
  "jhin-workflows",
]

[tool.uv.sources]
jhin-media = { workspace = true }
jhin-connectors = { workspace = true }
jhin-db = { workspace = true }
jhin-domain = { workspace = true }
jhin-events = { workspace = true }
jhin-oauth = { workspace = true }
jhin-observability = { workspace = true }
jhin-secrets = { workspace = true }
jhin-tools = { workspace = true }
jhin-workflows = { workspace = true }

[project.scripts]
jhin-tool-worker = "jhin_tool_worker.main:run"
jhin-runtime-gateway = "jhin_tool_worker.runtime_gateway:main"
# One sweep of ``sandbox_job`` rows whose runner is demonstrably gone, on
# demand. The worker runs the same sweep on its own schedule; this is the
# handle an operator (or a person reconciling one known row) can pull without
# waiting for it, and it must run in this service because the sandbox runner
# is reachable only from the ``runner`` network.
jhin-sandbox-reconcile = "jhin_tool_worker.cli:run_reconcile_sandbox_jobs"
# The one manual step in rolling this release back: close every tool_call
# left in ``claimed``, a status the previous release refuses outright. Pass
# ``--dry-run`` to see what it would close. See jhin_tool_worker.rollback.
jhin-tool-calls-rollback = "jhin_tool_worker.cli:run_rollback_claimed_tool_calls"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_tool_worker"]
