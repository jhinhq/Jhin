[project]
name = "jhin-agent-worker"
version = "0.1.0"
description = "Temporal worker executing Jhin agent runs (plan sections 7-8)"
requires-python = ">=3.13"
dependencies = [
    "temporalio>=1.31",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "nats-py>=2.13",
    "jhin-agents",
    "jhin-db",
    "jhin-domain",
    "jhin-events",
    "jhin-models",
    "jhin-observability",
    "jhin-secrets",
    "jhin-workflows",
]

[tool.uv.sources]
jhin-agents = { workspace = true }
jhin-db = { workspace = true }
jhin-domain = { workspace = true }
jhin-events = { workspace = true }
jhin-models = { workspace = true }
jhin-observability = { workspace = true }
jhin-secrets = { workspace = true }
jhin-workflows = { workspace = true }

[project.scripts]
jhin-agent-worker = "jhin_agent_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_agent_worker"]
