[project]
name = "jhin-workflow-worker"
version = "0.1.0"
description = "Temporal worker hosting Jhin workflow definitions"
requires-python = ">=3.13"
dependencies = [
    "temporalio>=1.31",
    "pydantic-settings>=2.7",
    "jhin-workflows",
    "jhin-observability",
    "jhin-secrets",
]

[project.scripts]
jhin-workflow-worker = "jhin_workflow_worker.main:run"

[tool.uv.sources]
jhin-workflows = { workspace = true }
jhin-observability = { workspace = true }
jhin-secrets = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_workflow_worker"]
