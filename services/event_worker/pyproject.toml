[project]
name = "jhin-event-worker"
version = "0.1.0"
description = "Durable NATS JetStream consumer for the Jhin event backbone"
requires-python = ">=3.13"
dependencies = [
    "nats-py>=2.13",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "temporalio>=1.9",
    "jhin-connectors",
    "jhin-db",
    "jhin-domain",
    "jhin-events",
    "jhin-observability",
    "jhin-secrets",
    "jhin-triggers",
    "jhin-workflows",
]

[project.scripts]
jhin-event-worker = "jhin_event_worker.main:run"

[tool.uv.sources]
jhin-connectors = { workspace = true }
jhin-db = { workspace = true }
jhin-domain = { workspace = true }
jhin-events = { workspace = true }
jhin-observability = { workspace = true }
jhin-secrets = { workspace = true }
jhin-triggers = { workspace = true }
jhin-workflows = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jhin_event_worker"]
